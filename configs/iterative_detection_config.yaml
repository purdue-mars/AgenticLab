vlm:
  backend: "qwen_local"  # Default backend: "gpt", "qwen", or "qwen_local"
  models:
    gpt:
      model: "gpt-5-mini-2025-08-07"
      temperature: 0.2
      max_completion_tokens: 15000
      api_key_env: "OPENAI_API_KEY"
      output_dir: "output/detection/gpt5mini"
    qwen:
      model: "qwen-vl-max"
      temperature: 0.2
      max_tokens: 15000
      api_key_env: "DASHSCOPE_API_KEY"
      base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
      output_dir: "output/detection/qwen"
    qwen3:
      model: "qwen3-vl-235b-a22b-instruct"
      temperature: 0.2
      max_tokens: 15000
      api_key_env: "DASHSCOPE_API_KEY"
      base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
      output_dir: "output/detection/qwen3"
    qwen_local:
      model: "Qwen/Qwen2.5-VL-7B-Instruct"  # HuggingFace model identifier
      temperature: 0.2
      max_tokens: 10000
      torch_dtype: "float16"
      load_in_8bit: false  # Enable 8-bit quantization for memory efficiency
      output_dir: "output/detection/qwen_local"
    molmo_local:
      model: "allenai/Molmo-7B-D-0924"
      temperature: 0.2
      max_tokens: 10000  #
      torch_dtype: "bfloat16"
      output_dir: "output/detection/molmo_local"
  iterations:
    max_iterations: 3                # Maximum number of iterations for refinement
    convergence_threshold: 0.05      # IOU threshold to consider boxes converged (5%)
  visualization:
    marker_radius: 8
    text_margin: 20
    line_height: 30
    colors:
      bounding_box:
        - [255, 0, 0]    # Red
        - [0, 255, 0]    # Green
        - [0, 0, 255]    # Blue
        - [255, 255, 0]  # Yellow
        - [255, 0, 255]  # Purple
        - [0, 255, 255]  # Cyan
      text: [255, 255, 255]  # White text
    show_iterations: true    # Whether to show iteration number in the visualization
    alpha_blend: 0.7         # Alpha value for the overlaid bounding boxes
